# Database settings for the Module Distribution System (XAMPP defaults).
# Start "MySQL" in the XAMPP Control Panel first. The database and tables are created automatically.

# Set to false to run with in-memory sample data only (nothing is saved).
db.enabled=true

# mysql  -> needs MySQL Connector/J (mysql-connector-j-x.y.z.jar)
# mariadb -> needs MariaDB Connector/J (mariadb-java-client-x.y.z.jar); use this if the MySQL one gives trouble
db.type=mysql

db.host=localhost
db.port=3306
db.name=module_distribution

# XAMPP's default account is "root" with an EMPTY password.
db.user=root
db.password=

# Optional: folder holding the driver .jar (default: a "lib" folder next to this file)
#db.libDir=

